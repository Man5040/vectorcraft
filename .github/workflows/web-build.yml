# Builds only the browser version of VectorCraft and publishes it as an artifact.
# Added by Man5040/estudio on the `bridge` branch; upstream code is unchanged apart from the bridge.
# Same toolchain, fonts and packaging as upstream's release.yml `web` job.
name: web build

on:
  push:
    branches: [bridge]
  workflow_dispatch:

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRUNK_VERSION: 0.21.14
    steps:
      - uses: actions/checkout@v4
      # Japanese, Chinese, Arabic and Thai fonts, embedded by crates/text/build.rs (as upstream's release).
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-build
          cache-on-failure: true
      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: Build and package
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/web/package.sh
      - name: Report size
        run: |
          {
            echo "### VectorCraft web"
            echo
            echo '```'
            ls -l dist/release/*.zip dist/web/*.wasm
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-web
          path: dist/release/vectorcraft-web-*.zip
          if-no-files-found: error
          retention-days: 90
